spring.datasource.url=jdbc:mysql://localhost:3306/search_engine?useSSL=false&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=search_user
spring.datasource.password=search_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.defer-datasource-initialization=true

server.port=8085

indexing-settings.sites[0].url=https://dombulgakova.ru/
indexing-settings.sites[0].name=dombulgakova
indexing-settings.sites[1].url=https://ipfran.ru/ 
indexing-settings.sites[1].name=ipfran
indexing-settings.sites[2].url=https://www.playback.ru
indexing-settings.sites[2].name=PlayBack.Ru
